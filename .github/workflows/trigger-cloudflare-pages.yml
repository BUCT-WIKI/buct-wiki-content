name: Trigger Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger Cloudflare Pages build
    runs-on: ubuntu-latest

    steps:
      - name: Call Cloudflare Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not configured"
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"

          echo "Cloudflare Pages build triggered"
